---
# cPanel Git™ Version Control deploy (one-click "Deploy HEAD Commit").
# Copies ONLY the web files into the domain's document root. Adjust DEPLOYPATH
# if cPanel → Domains shows a different Document Root for warthogacademy.co.zw.
deployment:
  tasks:
    - export DEPLOYPATH=/home/canchemc/warthogacademy.co.zw
    - /bin/mkdir -p $DEPLOYPATH/assets/img
    - /bin/cp -a index.html styles.css script.js $DEPLOYPATH/
    - /bin/cp -a assets/img/*.png assets/img/*.jpg $DEPLOYPATH/assets/img/
